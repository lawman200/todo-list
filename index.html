<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoFlow</title>
    <meta name="description" content="A modern, responsive todo app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-icon">✓</div>
          <div>
            <p class="eyebrow">TodoFlow</p>
            <h1>Rence dashboard</h1>
          </div>
        </div>

        <button id="clearAllBtn" class="ghost-button danger" type="button">
          Clear all
        </button>
      </header>

      <main class="app-card">
        <section class="summary-panel">
          <div class="stat-card accent">
            <span class="stat-label">Total</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Active</span>
            <strong id="activeCount">0</strong>
          </div>
          <div class="stat-card success">
            <span class="stat-label">Done</span>
            <strong id="doneCount">0</strong>
          </div>
        </section>

        <section class="composer" aria-label="Add new task">
          <form id="todoForm" class="todo-form">
            <label class="sr-only" for="taskInput">Task name</label>
            <input
              id="taskInput"
              type="text"
              maxlength="120"
              placeholder="Add a new task..."
              aria-label="New task"
            />
            <label class="select-wrap" for="reminderSelect">
              <span>Reminder</span>
              <select id="reminderSelect" aria-label="Reminder interval">
                <option value="0">Off</option>
                <option value="5">Every 5 min</option>
                <option value="10" selected>Every 10 min</option>
                <option value="15">Every 15 min</option>
                <option value="30">Every 30 min</option>
                <option value="60">Every 60 min</option>
              </select>
            </label>
            <button type="submit" class="primary-button">Add task</button>
          </form>
        </section>

        <section class="toolbar" aria-label="Task filters">
          <div class="chip-group" role="tablist" aria-label="Task filters">
            <button class="chip active" type="button" data-filter="all" aria-selected="true">All</button>
            <button class="chip" type="button" data-filter="active" aria-selected="false">Active</button>
            <button class="chip" type="button" data-filter="completed" aria-selected="false">Completed</button>
          </div>

          <button id="clearCompletedBtn" class="ghost-button" type="button">
            Remove completed
          </button>
        </section>

        <section class="tasks-panel">
          <ul id="todoList" class="todo-list" aria-live="polite"></ul>
          <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">✦</div>
            <h2>No tasks yet</h2>
            <p>Add your first task to get started.</p>
          </div>
        </section>
      </main>
    </div>

    <template id="taskTemplate">
      <li class="todo-item">
        <label class="task-main">
          <input class="task-checkbox" type="checkbox" />
          <div class="task-copy">
            <span class="task-text"></span>
            <span class="task-meta"></span>
          </div>
        </label>
        <div class="task-actions">
          <button class="icon-button edit-button" type="button" aria-label="Edit task">Edit</button>
          <button class="icon-button delete-button" type="button" aria-label="Delete task">Delete</button>
        </div>
      </li>
    </template>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
  </body>
</html>
